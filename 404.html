<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost among the stars — Stellar Refrain</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a1222">
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <style>
      @font-face { font-family: "Libre Caslon Display"; src: url("/assets/fonts/libre-caslon-display.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "DM Sans"; src: url("/assets/fonts/dm-sans-medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
        background: radial-gradient(ellipse 70% 60% at 50% 40%, #16264a 0%, #0a1222 60%, #070c18 100%);
        color: #f4eee3; font: 500 16px/1.6 "DM Sans", system-ui, sans-serif; text-align: center;
      }
      main { display: grid; justify-items: center; gap: 18px; max-width: 520px; }
      svg { width: 44px; height: 44px; color: #e7cd99; filter: drop-shadow(0 0 16px rgba(231, 205, 153, .5)); animation: turn 14s linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      p.code { margin: 6px 0 0; color: #e7cd99; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; }
      h1 { margin: 0; font: 400 clamp(44px, 9vw, 72px)/1 "Libre Caslon Display", Georgia, serif; letter-spacing: -.01em; }
      p { margin: 0; color: #cdd2dc; }
      a { margin-top: 14px; display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 14px; color: #1b1509; background: linear-gradient(180deg, #f2dcae, #dcbd83); text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 2px solid #a6e8ff; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5Q17.7 14.3 30.5 16 17.7 17.7 16 30.5 14.3 17.7 1.5 16 14.3 14.3 16 1.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M16 9.6Q16.8 15.2 22.4 16 16.8 16.8 16 22.4 15.2 16.8 9.6 16 15.2 15.2 16 9.6Z" fill="currentColor"/></svg>
      <p class="code">404 · Uncharted</p>
      <h1>Lost among the stars.</h1>
      <p>This page drifted out of range. Let’s get you back to Lyth.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
